<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate</title>
</head>
<body>
 <div class="no-print d-flex align-items-center gap-2 flex-wrap">
<div class="card shadow-sm mt-4">
    <div class="card-body">

        <!-- Filters -->
        <form method="GET" class="row g-3 mb-4 no-print">
            <div class="col-md-3">
                <label for="searchFilter" class="form-label">
                    Account/Client
                </label>
                <input
                    type="text"
                    id="searchFilter"
                    name="search"
                    class="form-control"
                    placeholder="Account ID or Client Name"
                    value="{{ selected_search }}"
                >
            </div>
    
</body>
</html>
